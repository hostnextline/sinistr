<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<title>Sinistr — carte de partage</title>
<meta name="robots" content="noindex">
<style>
@font-face{font-family:"Archivo";font-weight:400 700;font-display:block;src:url(assets/polices/archivo-normal-400-700.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Mono";font-weight:500;font-display:block;src:url(assets/polices/ibmplexmono-normal-500.woff2) format("woff2")}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:2400px;height:1260px;overflow:hidden;background:#EEF1F3}
.carte{width:1200px;height:630px;transform:scale(2);transform-origin:top left;
  background:#EEF1F3;color:#0E161D;font-family:"Archivo",sans-serif;
  display:grid;grid-template-columns:1fr 430px}
.texte{padding:60px 52px 52px 60px;display:flex;flex-direction:column;justify-content:space-between}
.marque{font-weight:700;font-size:25px;letter-spacing:-.02em}
.marque i{font-style:normal;color:#1B45E0}
h1{font-weight:700;font-size:74px;line-height:1.02;letter-spacing:-.04em;max-width:11ch}
.bas{display:flex;flex-direction:column;gap:10px;border-top:1px solid #D5DCE1;padding-top:22px}
.bas p{font-size:18px;color:#48555F;max-width:42ch}
.bas b{font-family:"IBM Plex Mono",monospace;font-size:14px;font-weight:500;letter-spacing:.09em;text-transform:uppercase;color:#7C8B95}
figure{position:relative;overflow:hidden}
figure img{width:100%;height:100%;object-fit:cover;object-position:62% 50%;display:block}
figure::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#EEF1F3 0%,rgba(238,241,243,0) 30%)}
</style></head><body>
<div class="carte">
  <div class="texte">
    <div class="marque">Sinistr<i>.</i></div>
    <h1>On vous ramène ici.</h1>
    <div class="bas">
      <b>Après-sinistre 24/7 · Grand Montréal</b>
      <p>Dégât d’eau, incendie, moisissure et reconstruction. Licence RBQ 5834-5539-01.</p>
    </div>
  </div>
  <figure><img src="assets/hero.jpg" alt=""></figure>
</div>
</body></html>
