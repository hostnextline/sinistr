<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Sinistr — carte urgence</title>
<meta name="robots" content="noindex">
<style>
@font-face{font-family:"Archivo";font-weight:400 900;font-display:block;src:url(assets/polices/archivo.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Mono";font-weight:500;font-display:block;src:url(assets/polices/ibmplexmono.woff2) format("woff2")}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:2400px;height:1260px;overflow:hidden;background:#0B0E11}
.carte{width:1200px;height:630px;transform:scale(2);transform-origin:top left;
  position:relative;background:#0B0E11;color:#F2F5F7;font-family:"Archivo",sans-serif;overflow:hidden}
.fond{position:absolute;inset:0}
.fond img{width:100%;height:100%;object-fit:cover;object-position:72% 50%}
.fond::after{content:"";position:absolute;inset:0;
  background:linear-gradient(96deg,#0B0E11 10%,rgba(11,14,17,.94) 44%,rgba(11,14,17,.5) 82%)}
.texte{position:relative;z-index:2;padding:56px 52px;height:100%;display:flex;flex-direction:column;justify-content:space-between}
.haut{display:flex;align-items:center;justify-content:space-between}
.marque{font-weight:800;font-size:25px;letter-spacing:-.02em}
.marque i{font-style:normal;color:#EF4C3A}
.balise{font-family:"IBM Plex Mono",monospace;font-size:13px;font-weight:500;letter-spacing:.14em;
  text-transform:uppercase;color:#EF4C3A;border:1px solid rgba(239,76,58,.34);border-radius:999px;padding:7px 15px}
h1{font-weight:900;font-size:70px;line-height:.98;letter-spacing:-.045em;max-width:13ch}
.bas{display:flex;align-items:center;gap:20px}
.num{background:#DA2E22;color:#fff;font-family:"IBM Plex Mono",monospace;font-weight:500;
  font-size:26px;padding:15px 30px;border-radius:4px}
.bas p{font-family:"IBM Plex Mono",monospace;font-size:14px;letter-spacing:.06em;color:#AEB9C2}
</style></head><body>
<div class="carte">
  <div class="fond"><img src="assets/hero.jpg" alt=""></div>
  <div class="texte">
    <div class="haut">
      <div class="marque">Sinistr<i>.</i></div>
      <div class="balise">Urgence · 24 h sur 24</div>
    </div>
    <h1>Un sinistre n’attend pas le matin.</h1>
    <div class="bas">
      <div class="num">1 877 657-4647</div>
      <p>RBQ 5834-5539-01 · GRAND MONTRÉAL</p>
    </div>
  </div>
</div>
</body></html>
